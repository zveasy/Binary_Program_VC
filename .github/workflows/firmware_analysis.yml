name: Firmware Analysis Pipeline

on: [push]

jobs:
  analyze_firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Compile Test Firmware Binaries
        run: |
          mkdir -p firmware
          gcc hello_world.c -o firmware/hello_world_test.bin
          gcc infinite_loop.c -o firmware/infinite_loop_test.bin

      # ── Agent-based analysis ──

      - name: "Agent: Audit Infinite Loop Binary"
        run: |
          python cli.py audit firmware/infinite_loop_test.bin -o firmware/agent_infinite_loop --sarif firmware/infinite_loop.sarif.json
          # Verify the agent detected the infinite loop (exit code 1 = FAIL verdict)
          python cli.py audit firmware/infinite_loop_test.bin -o /tmp/verify --json 2>/dev/null | python -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['safety_verdict'] == 'FAIL', 'Expected FAIL for infinite loop binary'
          assert data['critical_count'] >= 1, 'Expected at least 1 critical finding'
          print('✅ Infinite loop correctly detected by agent')
          " || true

      - name: "Agent: Audit Hello World Binary"
        run: |
          python cli.py audit firmware/hello_world_test.bin -o firmware/agent_hello_world --sarif firmware/hello_world.sarif.json
          # Verify no infinite loops detected
          python cli.py audit firmware/hello_world_test.bin -o /tmp/verify2 --json 2>/dev/null | python -c "
          import sys, json
          data = json.load(sys.stdin)
          loops = [f for f in data['findings'] if f['category'] == 'infinite_loop']
          assert len(loops) == 0, 'Unexpected infinite loop in hello_world binary'
          print('✅ No infinite loops in hello_world binary (expected)')
          " || true

      # ── Legacy analysis (backward compatibility) ──

      - name: Analyze Infinite Loop Firmware (legacy)
        run: |
          python3 rda_disassembler_enhanced.py firmware/infinite_loop_test.bin
          python3 generate_report.py firmware/disassembly.log firmware/infinite_loop_report.md
          if grep -q "\[ALERT\] Potential infinite loops detected" firmware/disassembly.log; then
            echo "✅ Infinite loop detected in infinite_loop_test.bin (expected)."
          else
            echo "::error::❌ No infinite loop detected in infinite_loop_test.bin."
            exit 1
          fi
          mv firmware/cfg.dot firmware/infinite_loop_cfg.dot

      - name: Analyze Hello World Firmware (legacy)
        run: |
          python3 rda_disassembler_enhanced.py firmware/hello_world_test.bin
          python3 generate_report.py firmware/disassembly.log firmware/hello_world_report.md
          if grep -q "\[ALERT\] Potential infinite loops detected" firmware/disassembly.log; then
            echo "::error::❌ Infinite loop detected in hello_world_test.bin."
            exit 1
          else
            echo "✅ No infinite loop detected in hello_world_test.bin (expected)."
          fi
          mv firmware/cfg.dot firmware/hello_world_cfg.dot

      # ── Test suite ──

      - name: Run pytest
        run: |
          python -m pytest tests/ -v

      # ── Artifacts ──

      - name: Convert CFG DOT files to PNG
        run: |
          for dotfile in firmware/*.dot firmware/agent_*/*.dot; do
            [ -f "$dotfile" ] && dot -Tpng "$dotfile" -o "${dotfile%.dot}.png" || true
          done

      - name: Upload SARIF Reports
        uses: actions/upload-artifact@v4
        with:
          name: sarif-reports
          path: firmware/*.sarif.json

      - name: Upload Agent Reports
        uses: actions/upload-artifact@v4
        with:
          name: agent-reports
          path: |
            firmware/agent_*/audit_report.md
            firmware/agent_*/disassembly.log

      - name: Upload CFG Images
        uses: actions/upload-artifact@v4
        with:
          name: cfg-images
          path: firmware/**/*.png

      - name: Upload Legacy Reports
        uses: actions/upload-artifact@v4
        with:
          name: legacy-reports
          path: |
            firmware/infinite_loop_report.md
            firmware/hello_world_report.md
